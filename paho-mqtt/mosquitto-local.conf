# Minimal Mosquitto configuration for running the VISSR stack against a local
# broker (used by paho-mqtt/local-broker.sh, which is called by runtest.sh and
# runstack.sh).
#
# Plain MQTT on port 1883 without authentication, which is what the VISSR
# server (mqttMgr) and the test clients use. Do NOT expose this broker on a
# public interface; local-broker.sh binds the published port to 127.0.0.1 only.
#
# The TLS/password protected broker used by the paho-mqtt Go test is configured
# in mosquitto.conf and is a separate thing.

listener 1883
allow_anonymous true
persistence false

log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true

syntax = "proto3";
package grpcProtobufMessages;

import "google/protobuf/struct.proto";
//import "google/protobuf/timestamp.proto";
option go_package = "./";

enum ResponseStatus {
    SUCCESS = 0;
    ERROR = 1;
}

enum SubscribeResponseType {
    SUB_RESPONSE = 0;
    SUB_EVENT = 1;
}

// ServiceStatus mirrors the VISSv3.2 Service profile status enum (§2 of the
// Services spec): UNKNOWN/ONGOING/SUCCESSFUL/CANCELED/FAILED.
enum ServiceStatus {
    UNKNOWN = 0;
    ONGOING = 1;
    SUCCESSFUL = 2;
    CANCELED = 3;
    FAILED = 4;
}

// ServiceFilterVariant enumerates the VISSv3.2 Service profile filter
// variants. These are a distinct set from FilterVariant (the VSS Data
// profile's paths/timebased/range/change/curvelog/history/metadata), kept in
// a separate enum/message (ServiceFilter) so the two filter domains are not
// mixed. TIMEBASED_SVC reuses the same {"period":"<ms>"} shape as the Data
// profile's TIMEBASED, just named distinctly to avoid confusion in this file.
enum ServiceFilterVariant {
    ALL = 0;
    STATUS = 1;
    TIMEBASED_SVC = 2;
    NONE = 3;
    RESOURCE = 4;
}

// ServiceStreamType distinguishes the initial synchronous response from a
// later asynchronous "monitoring" event on the same Invoke/Monitor stream.
enum ServiceStreamType {
    SERVICE_RESPONSE = 0;
    SERVICE_EVENT = 1;
}

service VISS {
  rpc GetRequest (GetRequestMessage) returns (GetResponseMessage);

  rpc SetRequest (SetRequestMessage) returns (SetResponseMessage);

  rpc SubscribeRequest (SubscribeRequestMessage) returns (stream SubscribeStreamMessage);

  rpc UnsubscribeRequest (UnsubscribeRequestMessage) returns (UnsubscribeResponseMessage);

  // VISSv3.2 Service profile (VehicleService.* trees). InvokeRequest and
  // MonitorRequest are server-streaming: the first message is the
  // synchronous ACK/response, and if its status is ONGOING, monitoring
  // events for the same session follow until a terminal status is reached.
  rpc InvokeRequest (InvokeRequestMessage) returns (stream InvokeStreamMessage);

  rpc MonitorRequest (MonitorRequestMessage) returns (stream MonitorStreamMessage);

  rpc CancelRequest (CancelRequestMessage) returns (CancelResponseMessage);

  rpc DiscoverRequest (DiscoverRequestMessage) returns (DiscoverResponseMessage);
}

message ErrorResponseMessage {
    string Number = 1;
    string Reason = 2;
    string Description = 3;
}

message FilterExpressions {
  message FilterExpression {
    enum FilterVariant {
        PATHS = 0;
        TIMEBASED = 1;
        RANGE = 2;
        CHANGE = 3;
        CURVELOG = 4;
        HISTORY = 5;
        METADATA = 6;
    }
    FilterVariant Variant = 1;

    message FilterValue {
        message PathsValue {
            repeated string RelativePath = 1;
        }
        optional PathsValue ValuePaths = 1;

        message TimebasedValue {
            string Period = 1;
        }
        optional TimebasedValue ValueTimebased = 2;

        message RangeValue {
            string LogicOperator = 1;
            string Boundary = 2;
        }
        repeated RangeValue ValueRange = 3;

        message ChangeValue {
            string LogicOperator = 1;
            string Diff = 2;
        }
        optional ChangeValue ValueChange = 4;

        message CurvelogValue {
            string MaxErr = 1;
            string BufSize = 2;
        }
        optional CurvelogValue ValueCurvelog = 5;

        message HistoryValue {
            string TimePeriod = 1;  //ISO8601 period expression
        }
        optional HistoryValue ValueHistory = 6;

        message MetadataValue {
            string Tree = 1;
        }
        optional MetadataValue ValueMetadata = 7;
    }
    FilterValue Value = 2;
  }
  repeated FilterExpression FilterExp = 1;
}

message DataPackages {
    message DataPackage {
        string Path = 1;

        message DataPoint {
            string Value = 1;
            string Ts = 2;
        }
        repeated DataPoint Dp = 2;
    }
    repeated DataPackage Data = 1;
}

message GetRequestMessage {
        string Path = 1;
        optional FilterExpressions Filter = 2;
        optional string Authorization = 3;
        optional string DC = 4;
        string RequestId = 5;
}

message GetResponseMessage {
        ResponseStatus Status = 1;
        message SuccessResponseMessage {
            optional DataPackages DataPack = 1;
            optional string Metadata = 2; // replaces DataPack in metadata variant
        }
        optional SuccessResponseMessage SuccessResponse = 2;
        optional ErrorResponseMessage ErrorResponse = 3;
        string RequestId = 4;
        string Ts = 5;
        optional string Authorization = 6;
}

message SetRequestMessage {
        string Path = 1;
        string Value = 2;
        optional string Authorization = 3;
        string RequestId = 4;
}

message SetResponseMessage {
        ResponseStatus Status = 1;
        optional ErrorResponseMessage ErrorResponse = 2;
        string RequestId = 3;
        string Ts = 4;
        optional string Authorization = 5;
}

message SubscribeRequestMessage {
        string Path = 1;
        optional FilterExpressions Filter = 2;
        optional string Authorization = 3;
        optional string DC = 4;
        string RequestId = 5;
}

message SubscribeStreamMessage {
    SubscribeResponseType MType = 1;
    ResponseStatus Status = 2;

    message SubscribeResponseMessage {
        optional ErrorResponseMessage ErrorResponse = 1;
        optional string SubscriptionId = 2;
        string RequestId = 3;
        string Ts = 4;
        optional string Authorization = 5;
    }
    optional SubscribeResponseMessage Response = 3;

    message SubscribeEventMessage {
        string SubscriptionId = 1;
        message SuccessResponseMessage {
            DataPackages DataPack = 1;
        }
        optional SuccessResponseMessage SuccessResponse = 2;
        optional ErrorResponseMessage ErrorResponse = 3;
        string Ts = 4;
    }
    optional SubscribeEventMessage Event = 4;
}

message UnsubscribeRequestMessage {
        string SubscriptionId = 1;
        string RequestId = 2;
}

message UnsubscribeResponseMessage {
        ResponseStatus Status = 1;
        optional ErrorResponseMessage ErrorResponse = 2;
        string RequestId = 3;
        string Ts = 4;
}

// ********** VISSv3.2 Service profile (VehicleService.* trees) ***********
//
// The Service profile filter is a wholly different, unrelated concept from
// the VSS Data profile's FilterExpressions above (its variants are
// all/status/timebased/none/resource, not paths/range/change/curvelog/
// history/metadata), so it is modeled with its own ServiceFilter message
// rather than reusing FilterExpressions.

message ServiceFilter {
    ServiceFilterVariant Variant = 1;
    optional string Period = 2;       // TIMEBASED_SVC only, milliseconds as string
    repeated string ResourcePath = 3; // RESOURCE only, path snippet(s), may contain '*' wildcards
}

// ServiceError unifies the two error shapes used by the Service profile:
// the invoke/monitor/cancel/discover shape (Number/Reason/Description,
// optionally Fields on a validation error, VISSv3.3 §29) and the
// monitoring-event shape (Code/Message). All fields are optional; a given
// message only ever populates the subset relevant to its context.
message ServiceError {
    optional string Number = 1;
    optional string Reason = 2;
    optional string Description = 3;
    repeated string Fields = 4;
    optional string Code = 5;
    optional string Message = 6;
}

message ServiceIndata {
    optional google.protobuf.Struct Input = 1;
    string Ts = 2;
}

message ServiceOutdata {
    optional google.protobuf.Struct Output = 1;
    string Ts = 2;
}

message ServiceResourceOutdata {
    string ResourceKey = 1;
    ServiceOutdata Outdata = 2;
}

message ServiceResourceOutdataArray {
    repeated ServiceResourceOutdata Resource = 1;
}

// ServiceOutdataWrapper carries either the single-resource outdata shape or
// the multi-resource (outdataByResource) array shape produced for a
// multiplexed procedure invocation - see wrapOutdataByResource/
// buildOutdataArrayFromWrapped in vissServiceMgr.go.
message ServiceOutdataWrapper {
    oneof OutdataVariant {
        ServiceOutdata Single = 1;
        ServiceResourceOutdataArray Multi = 2;
    }
}

// MonitoringEventMessage is the asynchronous "monitoring" event pushed on an
// Invoke/Monitor stream after the initial response, for as long as the
// invocation stays ONGOING.
message MonitoringEventMessage {
    string Path = 1;
    optional ServiceOutdataWrapper Outdata = 2;
    string ServiceId = 3;
    ServiceStatus Status = 4;
    optional ServiceError Error = 5;
    optional int32 Progress = 6; // VISSv3.3 §28, ONGOING only
    string Ts = 7;
}

// ---- invoke (VISSv3.2 §6.1 / VISSv3.3 §10) ----

message InvokeRequestMessage {
    string Path = 1;
    optional google.protobuf.Struct Input = 2;
    repeated ServiceFilter Filter = 3;
    optional string Authorization = 4;
    optional string Timeout = 5; // milliseconds, VISSv3.3 extension
    string RequestId = 6;
}

message InvokeResponseMessage {
    ServiceStatus Status = 1;
    optional string Path = 2;
    optional ServiceOutdataWrapper Outdata = 3;
    optional string ServiceId = 4;
    optional ServiceError Error = 5;
    optional string RequestId = 6;
    string Ts = 7;
}

message InvokeStreamMessage {
    ServiceStreamType MType = 1;
    oneof Payload {
        InvokeResponseMessage Response = 2;
        MonitoringEventMessage Event = 3;
    }
}

// ---- monitor (VISSv3.2 §6.2) ----

message MonitorRequestMessage {
    string Path = 1;
    repeated ServiceFilter Filter = 2;
    optional string Authorization = 3;
    string RequestId = 4;
}

message MonitorResponseMessage {
    ServiceStatus Status = 1;
    optional string Path = 2;
    optional ServiceIndata Indata = 3;
    optional ServiceOutdataWrapper Outdata = 4;
    optional string ServiceId = 5;
    optional ServiceError Error = 6;
    optional string RequestId = 7;
    string Ts = 8;
}

message MonitorStreamMessage {
    ServiceStreamType MType = 1;
    oneof Payload {
        MonitorResponseMessage Response = 2;
        MonitoringEventMessage Event = 3;
    }
}

// ---- cancel (VISSv3.2 §6.3) ----

message CancelRequestMessage {
    string ServiceId = 1;
}

message CancelResponseMessage {
    ServiceStatus Status = 1;
    optional ServiceOutdataWrapper Outdata = 2;
    optional ServiceError Error = 3;
    string ServiceId = 4;
    string Ts = 5;
}

// ---- discover (VISSv3.2 §6.4, updated per the "Discover" spec revision:
// depth replaces the resource filter, and metadata for all instances of a
// multiplexed service is always returned) ----

message DiscoverRequestMessage {
    string Path = 1;
    string Depth = 2; // mandatory; "0" = all generations
    optional string Authorization = 3;
    string RequestId = 4;
}

message DiscoverResponseMessage {
    optional google.protobuf.Struct Metadata = 1;
    optional ServiceError Error = 2;
    string RequestId = 3;
    string Ts = 4;
}

// ********** For non-gRPC usage of protobuf ***********

enum MessageMethod {
    GET = 0;
    SET = 1;
    SUBSCRIBE = 2;
    UNSUBSCRIBE = 3;
}

enum MessageType {
    REQUEST = 0;
    RESPONSE = 1;
    STREAM = 2;
}

message ProtobufMessage {
    MessageMethod Method = 1;
    optional GetMessage Get = 2;
    optional SetMessage Set = 3;
    optional SubscribeMessage Subscribe = 4;
    optional UnsubscribeMessage Unsubscribe = 5;
}

message GetMessage {
    MessageType MType = 1;
    optional GetRequestMessage Request = 2;
    optional GetResponseMessage Response = 3;
}

message SetMessage {
    MessageType MType = 1;
    optional SetRequestMessage Request = 2;
    optional SetResponseMessage Response = 3;
}

message SubscribeMessage {
    MessageType MType = 1;
    optional SubscribeRequestMessage Request = 2;
    optional SubscribeStreamMessage Stream = 3;
}

message UnsubscribeMessage {
    MessageType MType = 1;
    optional UnsubscribeRequestMessage Request = 2;
    optional UnsubscribeResponseMessage Response = 3;
}

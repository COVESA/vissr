  datatype: uint32
  description: Duration of massage session in seconds.
  type: property

VehicleService.Seating.ActivateMassage.Row1.DriverSide.Input.MassageType:
  datatype: string
  description: Type of massage. Supported types are retrieved via GetCapabilities().
  type: property


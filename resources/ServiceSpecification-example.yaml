VehicleService:
  description: The Vehicle services.
  type: branch

VehicleService.Seating:
  description: The Seating service group.
  type: branch

VehicleService.Seating.Row1:
  description: The Seating service group.
  type: branch

VehicleService.Seating.Row1.DriverSide:
  description: The Seating service group.
  type: branch

VehicleService.Seating.Row1.DriverSide.ActivateMassage:
  description: Performs all supported seat massage.
  type: procedure

VehicleService.Seating.Row1.DriverSide.ActivateMassage.Input:
  description: Input parameters= (Duration, Credentials).
  type: iostruct

VehicleService.Seating.Row1.DriverSide.ActivateMassage.Input.Credentials:
  datatype: string
  description: A token with client credentials. Optional parameter.
  type: property

VehicleService.Seating.Row1.DriverSide.ActivateMassage.Input.Duration:
  datatype: uint32
  description: Duration of massage session in seconds.
  type: property

VehicleService.Seating.Row1.DriverSide.ActivateMassage.Output:
  description: Output parameters= (Status, ServiceId).
  type: iostruct

VehicleService.Seating.Row1.DriverSide.ActivateMassage.Output.ServiceId:
  datatype: uint32
  description: A reference to the service execution session.
  type: property

VehicleService.Seating.Row1.DriverSide.ActivateMassage.Output.Status:
  datatype: int8
  default: 0
  description: Status of the ActivateMassage service.
  enum:
    CANCELED: 2
    FAILED: -1
    ONGOING: 1
    SUCCESSFUL: 0
  type: property

VehicleService.Seating.Row1.DriverSide.ActivateMassage.Version:
  datatype: string
  default: 1.0.0
  description: The ActivateMassage service version.
  type: attribute

VehicleService.Seating.Row1.DriverSide.GetCapabilities:

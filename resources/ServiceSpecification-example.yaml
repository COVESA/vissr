  description: Output parameters= (Status, ServiceId).
  type: iostruct

VehicleService.Seating.ActivateMassage.Row1.DriverSide.Output.ServiceId:
  datatype: uint32
  description: A reference to the service execution session.
  type: property

VehicleService.Seating.ActivateMassage.Row1.DriverSide.Output.Status:
  datatype: int8
  default: 0
  description: Status of the ActivateMassage service.
  enum:
    CANCELED: 2
    FAILED: -1
    ONGOING: 1
    SUCCESSFUL: 0
  type: property


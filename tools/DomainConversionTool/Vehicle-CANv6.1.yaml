  type: actuator

Action:
  allowed:
  - UNKNOWN
  - STOP
  - PLAY
  - FAST_FORWARD
  - FAST_BACKWARD
  - SKIP_FORWARD
  - SKIP_BACKWARD
  datatype: string
  description: Tells if the media was
  type: actuator

DeclinedURI:
  datatype: string
  description: URI of suggested media that was declined
  type: sensor

Album:

  max: 100
  min: 0
  type: sensor
  unit: percent

Vehicle.Exterior.PrecipitationIntensity:
  comment: 'Provides an absolute intensity measurement complementing Vehicle.Body.Raindetection.Intensity (which is a relative 0-100 percent scale). Applies to all precipitation types reported by Vehicle.Exterior.PrecipitationType; value is 0 when PrecipitationType is NONE. Measurement method is sensor specific.

    '
  datatype: float
  description: Precipitation intensity in millimeters per hour.
  min: 0
  type: sensor
  unit: mm/h

Vehicle.Exterior.PrecipitationType:
  comment: 'Discriminates precipitation type from Vehicle.Body.Raindetection.Intensity, which reports intensity for rain only. UNKNOWN (0) shall be used when precipitation type cannot be assessed. NONE (1) indicates no precipitation detected. HAIL (5) includes sleet and freezing rain as a precipitation type (distinct from black ice formation on the road surface, which is reported by Vehicle.Safety.RoadIcingState when available). Values are aligned with SENSORIS v1.6 Precipitation.TypeAndConfidence. Determination method is implementation specific.

    '
  datatype: uint8
  description: Type of precipitation currently detected outside the vehicle.
  enum:
    HAIL: 5
    MIXED_RAIN_SNOW: 3
    NONE: 1
    RAIN: 2
    SNOW: 4
    UNKNOWN: 0
  type: sensor

Vehicle.Exterior.RoadObstruction:
  comment: 'Reports the category of road obstruction detected by the vehicle''s perception systems. UNKNOWN (0) shall be used when obstruction type cannot be classified. NONE (9) indicates no obstruction detected. SHED_LOAD (4) covers cargo fallen from another vehicle. LAND_SLIP (5) or landslide is ground material that has slid down slope into road. ANIMAL (6) covers small animals (cat, dog); ANIMAL_LARGE (7) covers large animals (deer, horse, livestock); ANIMAL_HERD (8) covers groups of animals on road. FLOODING (10) indicates standing water sufficient to obstruct passage (distinct from WET surface state in Vehicle.Exterior.RoadSurfaceCondition). Values 1-8 are aligned with SENSORIS v1.6 RoadObstructionCondition.TypeAndConfidence and TPEG-TEC road obstruction taxonomy. Determination method is implementation specific (camera, radar, lidar). Primary consumers: navigation systems (dynamic re-routing), ADAS safety systems, and emergency dispatch systems.

    '
  datatype: uint8
  description: Type of road obstruction detected ahead of the vehicle.
  enum:
    ANIMAL: 6
    ANIMAL_HERD: 8
    ANIMAL_LARGE: 7
    AVALANCHE: 2
    FLOODING: 10
    LAND_SLIP: 5
    NONE: 9
    ROCKFALLS: 3
    SHED_LOAD: 4
    TREE: 1
    UNKNOWN: 0
  type: sensor

Vehicle.Exterior.RoadSurfaceCondition:
  comment: 'Determination method is implementation specific. May be derived from sensor fusion of Vehicle.ADAS.ESC.RoadFriction.MostProbable, Vehicle.Exterior.AirTemperature, Vehicle.Body.Raindetection.Intensity, and optional camera-based road surface classification. UNKNOWN (0) shall be used when the system cannot assess the road surface condition. Primary consumers: navigation and ADAS safety systems. Related to VSS issue #877 (Connected Safety signals).

    '
  datatype: uint8
  description: Assessed condition of the road surface beneath or ahead of the vehicle.
  enum:
    DRY: 1
    ICE: 4
    LOOSE_GRAVEL: 7
    SLUSH: 5
    SNOW: 3
    UNKNOWN: 0
    WET: 2
    WET_ICE: 6
  type: sensor

Vehicle.Exterior.RoadSurfaceContaminant:
  comment: 'Reports road surface contaminants that are distinct from weather-related surface state (covered by Vehicle.Exterior.RoadSurfaceCondition) and road obstruction objects (tree, rockfall, etc.). UNKNOWN (0) shall be used when the system cannot assess surface contamination. NONE (5) indicates no surface contaminant detected. MUD (1) indicates wet dirt. CHIPPINGS (2) indicates loose aggregate (tire damage risk, reduced road holding). OIL (3) and FUEL (4) indicate liquid hydrocarbon contamination (slip hazard and fire risk). Values 1-4 are aligned with SENSORIS v1.6 RoadSurfaceCondition.TypeAndConfidence. Determination method is implementation specific.

    '
  datatype: uint8
  description: Detected non-weather surface contaminant on the road beneath or ahead of the vehicle.
  enum:
    CHIPPINGS: 2
    FUEL: 4
    MUD: 1
    NONE: 5
    OIL: 3
    UNKNOWN: 0
  type: sensor

Vehicle.Exterior.RoadSurfaceTemperature:
  comment: 'Distinct from Vehicle.Exterior.AirTemperature: the road surface can sit several degrees below the air, most notably on bridge decks and in shaded cuttings, so surface temperature is the determining input for icing risk when the air reads above freezing while the road is still frozen. A natural fusion input to Vehicle.Exterior.RoadSurfaceCondition alongside air temperature and Vehicle.ADAS.ESC.RoadFriction.MostProbable, and to Vehicle.Safety.RoadIcingState where available. Measurement method is implementation specific (typically infrared pyrometer) and the value may also originate from external road-weather infrastructure. Related to VSS issue #877 (Connected Safety signals).

    '
  datatype: float
  description: Temperature of the road surface beneath or ahead of the vehicle.
  type: sensor
  unit: Celsius

Vehicle.Exterior.VisibilityCondition:
  comment: 'Reports the dominant cause of reduced visibility. UNKNOWN (0) shall be used when visibility condition cannot be assessed (e.g., camera unavailable or confidence below threshold). CLEAR (1) indicates no significant visibility reduction. LOW_* values indicate conditions that materially reduce driver or sensor visibility range. Values are aligned with SENSORIS v1.6 VisibilityCondition.TypeAndConfidence. Determination method is implementation specific. May be derived from camera-based classification, Vehicle.Body.Raindetection.Intensity, Vehicle.Exterior.AirTemperature, and Vehicle.Body.Windshield.Wiping.Mode. Complements Vehicle.Exterior.VisibilityDistance for quantitative range. Primary consumers: ADAS systems, navigation (dynamic re-routing), and emergency dispatch systems.

    '
  datatype: uint8
  description: Assessed visibility condition outside the vehicle.
  enum:
    CLEAR: 1
    LOW_FOG: 6
    LOW_HEAVY_RAIN: 3
    LOW_HEAVY_SNOW: 4
    LOW_SMOKE: 5
    LOW_SUN_GLARE: 7
    MIST: 2
    UNKNOWN: 0
  type: sensor

Vehicle.Exterior.VisibilityDistance:
  comment: 'Forward visibility range in meters as assessed by the vehicle''s sensing systems. 0 indicates near-zero visibility. Value may be limited by sensor range rather than actual atmospheric visibility; see VisibilityCondition for the qualitative assessment. Determination method is implementation specific. May be derived from camera-based visibility estimation, lidar range reduction, or radar clutter analysis.

    '
  datatype: float
  description: Estimated visible distance ahead of the vehicle in current conditions.
  min: 0
  type: sensor
  unit: m

Vehicle.Exterior.WindDirection:
  comment: 'Wind direction from which wind is blowing, using meteorological convention (0 = from North, 90 = from East, 180 = from South, 270 = from West). Only meaningful when WindSpeed is above a minimum threshold; value when WindSpeed is near 0 is implementation specific.

    '
  datatype: float
  description: Wind direction in degrees (meteorological convention, 0 = North, 90 = East).
  max: 360
  min: 0
  type: sensor
  unit: degrees

Vehicle.Exterior.WindSpeed:
  comment: 'Measured or estimated wind speed in meters per second. May be derived from anemometer sensors, aerodynamic load estimation, or external weather service input.


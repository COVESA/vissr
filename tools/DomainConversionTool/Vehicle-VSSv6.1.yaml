Vehicle.Powertrain.TractionBattery.Temperature.CellTemperature:
  comment: Cells are identified by relative position in array.
  datatype: float[]
  description: Array of cell temperatures. Length or array shall correspond to number of cells in vehicle.
  type: sensor

Vehicle.Powertrain.TractionBattery.Temperature.Max:
  datatype: float
  description: Current maximum temperature of the battery cells, i.e. temperature of the hottest cell.
  type: sensor
  unit: Celsius

Vehicle.Powertrain.TractionBattery.Temperature.Min:
  datatype: float
  description: Current minimum temperature of the battery cells, i.e. temperature of the coldest cell.
  type: sensor
  unit: Celsius

Vehicle.Powertrain.TractionBattery.TimeRemaining:
  datatype: uint32
  description: Time remaining in seconds before the battery is empty.
  type: sensor
  unit: s

Vehicle.Powertrain.Transmission.ClutchEngagement:
  datatype: float
  description: Clutch engagement. 0% = Clutch fully disengaged. 100% = Clutch fully engaged.
  max: 100
  min: 0
  type: actuator
  unit: percent

Vehicle.Powertrain.Transmission.ClutchWear:
  datatype: uint8
  description: Clutch wear as a percent. 0 = no wear. 100 = worn.
  max: 100
  type: sensor
  unit: percent

Vehicle.Powertrain.Transmission.CurrentGear:
  datatype: int8
  description: The current gear. 0=Neutral, 1/2/..=Forward, -1/-2/..=Reverse.
  type: sensor

Vehicle.Powertrain.Transmission.DiffLockFrontEngagement:
  datatype: float
  description: Front Diff Lock engagement. 0% = Diff lock fully disengaged. 100% = Diff lock fully engaged.
  max: 100
  min: 0
  type: actuator
  unit: percent

Vehicle.Powertrain.Transmission.DiffLockRearEngagement:
  datatype: float
  description: Rear Diff Lock engagement. 0% = Diff lock fully disengaged. 100% = Diff lock fully engaged.
  max: 100
  min: 0
  type: actuator
  unit: percent

Vehicle.Powertrain.Transmission.DriveType:
  allowed:
  - UNKNOWN
  - FORWARD_WHEEL_DRIVE
  - REAR_WHEEL_DRIVE
  - ALL_WHEEL_DRIVE
  datatype: string
  default: UNKNOWN
  description: Drive type.
  type: attribute

Vehicle.Powertrain.Transmission.GearChangeMode:
  allowed:
  - MANUAL
  - AUTOMATIC
  datatype: string
  description: Is the gearbox in automatic or manual (paddle) mode.
  type: actuator

Vehicle.Powertrain.Transmission.GearCount:
  datatype: int8
  default: 0
  description: Number of forward gears in the transmission. -1 = CVT.
  type: attribute

Vehicle.Powertrain.Transmission.IsElectricalPowertrainEngaged:
  comment: In some hybrid solutions it is possible to disconnect/disengage the electrical powertrain mechanically to avoid induced voltage reaching a too high level when driving at high speed.
  datatype: boolean
  description: Is electrical powertrain mechanically connected/engaged to the drivetrain or not. False = Disconnected/Disengaged. True = Connected/Engaged.
  type: actuator

Vehicle.Powertrain.Transmission.IsLowRangeEngaged:
  comment: The possibility to switch between low and high gear range is typically only available in heavy vehicles and off-road vehicles.
  datatype: boolean
  description: Is gearbox in low range mode or not. False = Normal/High range engaged. True = Low range engaged.
  type: actuator

Vehicle.Powertrain.Transmission.IsParkLockEngaged:
  datatype: boolean
  description: Is the transmission park lock engaged or not. False = Disengaged. True = Engaged.
  type: actuator

Vehicle.Powertrain.Transmission.PerformanceMode:
  allowed:
  - NORMAL
  - SPORT
  - ECONOMY
  - SNOW
  - RAIN
  datatype: string
  description: Current gearbox performance mode.
  type: actuator

Vehicle.Powertrain.Transmission.SelectedGear:
  datatype: int8
  description: The selected gear. 0=Neutral, 1/2/..=Forward, -1/-2/..=Reverse, 126=Park, 127=Drive.
  type: actuator

Vehicle.Powertrain.Transmission.Temperature:
  datatype: float
  description: The current gearbox temperature.
  type: sensor
  unit: Celsius

Vehicle.Powertrain.Transmission.TorqueDistribution:
  datatype: float
  description: Torque distribution between front and rear axle in percent. -100% = Full torque to front axle, 0% = 50:50 Front/Rear, 100% = Full torque to rear axle.
  max: 100
  min: -100
  type: actuator
  unit: percent

Vehicle.Powertrain.Transmission.TravelledDistance:
  datatype: float
  description: Odometer reading, total distance travelled during the lifetime of the transmission.
  type: sensor
  unit: km

Vehicle.Powertrain.Transmission.Type:
  allowed:
  - UNKNOWN
  - SEQUENTIAL
  - H
  - AUTOMATIC
  - DSG
  - CVT
  datatype: string
  default: UNKNOWN
  description: Transmission type.
  type: attribute

Vehicle.Powertrain.Type:
  allowed:
  - COMBUSTION
  - HYBRID
  - ELECTRIC
  comment: For vehicles with a combustion engine (including hybrids) more detailed information on fuels supported can be found in FuelSystem.SupportedFuelTypes and FuelSystem.SupportedFuels.
  datatype: string
  description: Defines the powertrain type of the vehicle.
  type: attribute

Vehicle.RoofLoad:
  datatype: int16
  description: The permitted total weight of cargo and installations (e.g. a roof rack) on top of the vehicle.
  type: attribute
  unit: kg

Vehicle.Safety.Airbag.IsReleased:
  datatype: boolean
  default: false
  description: Set to true if the airbag is released.
  type: sensor

Vehicle.Safety.IsFire:
  comment: 'Determination method is implementation specific. May be derived from temperature sensors, battery thermal runaway detection, or dedicated fire/smoke detection systems. Primary consumers: emergency dispatch and first responder systems. Related to VSS issue #877 (Connected Safety signals).

    '
  datatype: boolean
  description: Indicates whether a fire has been detected in or on the vehicle.
  type: sensor

Vehicle.Safety.IsSubmersed:
  comment: 'Determination method is implementation specific. May be derived from pressure sensors, water contact sensors, door seal sensors, or anomalous rain detection intensity readings. Primary consumers: emergency dispatch and first responder systems. Related to VSS issue #877 (Connected Safety signals).

    '
  datatype: boolean
  description: Indicates whether the vehicle is partially or fully submersed in water.
  type: sensor

Vehicle.Safety.RoadIcingState:
  allowed:
  - UNKNOWN
  - NONE
  - RISK
  - DETECTED
  comment: 'Derived assessment distinct from Vehicle.Exterior.RoadSurfaceCondition, which reports observed surface state; RoadIcingState reports the derived risk of icing-related loss of control. RISK can be elevated even when RoadSurfaceCondition reports DRY (black ice, freezing-rain onset), and NONE can hold even when it reports SNOW (low-speed packed snow with adequate winter-tire grip). May be derived from Vehicle.Exterior.RoadSurfaceCondition, Vehicle.Exterior.AirTemperature, Vehicle.ADAS.ESC.RoadFriction.MostProbable, and Vehicle.Exterior.RoadSurfaceTemperature. NONE indicates no elevated icing risk. RISK indicates conditions favor ice formation or onset of icing-related traction loss. DETECTED indicates active icing-related loss of control is occurring. UNKNOWN shall be used when the system cannot assess icing risk. Criteria for each state may be OEM specific. Primary consumers: driver-warning systems, ADAS interventions, and navigation systems (re-routing away from elevated-risk segments). Related to VSS
    issue #877 (Connected Safety signals).

    '
  datatype: string
  description: Indicates whether the vehicle is currently at risk of icing-related loss of control or has detected such conditions affecting traction.
  type: sensor

Vehicle.Safety.Rollover:
  allowed:
  - UNKNOWN
  - NONE
  - RISK
  - DETECTED
  comment: 'May be derived from Vehicle.AngularVelocity, Vehicle.Orientation.Roll, and Vehicle.Orientation.Pitch signals. NONE indicates normal orientation. RISK indicates the vehicle is at elevated risk of rollover. DETECTED indicates a rollover event has occurred. UNKNOWN shall be used when the system cannot assess rollover status. Criteria for each state may be OEM specific. Primary consumers: emergency dispatch and first responder systems. Related to VSS issue #877 (Connected Safety signals).

    '
  datatype: string
  description: Indicates whether the vehicle has rolled over or is at risk of rollover.
  type: sensor

Vehicle.Safety.VisibilityImpairment:
  allowed:
  - UNKNOWN
  - NONE
  - RISK
  - DETECTED
  comment: 'Derived safety assessment layered on the Exterior observational signals Vehicle.Exterior.VisibilityCondition (dominant cause of reduced visibility) and Vehicle.Exterior.VisibilityDistance (quantitative range). VisibilityImpairment is cause-agnostic and reports only the derived, speed-relative safety risk on top of those signals; the cause itself (snow, fog, etc.) is carried by VisibilityCondition. May be derived from Vehicle.Exterior.VisibilityCondition and Vehicle.Exterior.VisibilityDistance, optionally combined with vehicle speed and stopping-distance context. NONE indicates visibility is adequate for current driving conditions. RISK indicates visibility is degrading toward a level that materially raises driving risk for the current speed. DETECTED indicates visibility impairment severe enough to require driver action is active. UNKNOWN shall be used when the system cannot assess visibility impairment. Criteria for each state may be OEM specific. Primary consumers: driver-warning systems, navigation
    systems (re-routing on impaired visibility), and emergency dispatch systems. Related to VSS issue #877 (Connected Safety signals).

    '
  datatype: string
  description: Indicates whether reduced exterior visibility is currently creating a driving-safety risk, or such a condition has been detected.
  type: sensor

Vehicle.Service.DistanceToService:
